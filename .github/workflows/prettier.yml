name: Prettier Check

on:
  pull_request:
    branches:
      - develop

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Make sure the whole repo is checked out to allow Prettier to find all files
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your preferred Node.js version

      - name: Install dependencies
        run: npm install

      - name: Run Prettier check
        run: npx prettier --check .